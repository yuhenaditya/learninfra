name: Example Build Image

on:
  push:
    branches:
      - "dev"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra
  ENV: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Image Production
    runs-on: ubuntu-latest
    environment: Production
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr-build
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image vote
      id: build-image-vote
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "Building Docker image..."
        docker build -t 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:vote ./vote
        echo "Pushing Docker image to ECR..."
        docker push 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:vote

    - name: Build, tag, and push image worker
      id: build-image-worker
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "Building Docker image..."
        docker build -t 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:worker ./worker
        echo "Pushing Docker image to ECR..."
        docker push 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:worker

    - name: Build, tag, and push image result
      id: build-image-result
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "Building Docker image..."
        docker build -t 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:result ./result
        echo "Pushing Docker image to ECR..."
        docker push 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:result

    - name: End Build
      run: echo "Build Success"

  master:
    name: Example Pull Image on master
    runs-on: ubuntu-latest  # change this to a valid runner
    steps:
      - name: Update runner's docker Version, as worker module requires it
        run: |
          docker --version

      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr-pullmaster
        uses: aws-actions/amazon-ecr-login@v1
  
      - name: Pull image
        id: pull-image-master
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra
        run: |
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:worker
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:vote
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:result

  node1:
    name: Example Pull Image on node1
    runs-on: ubuntu-latest  # change this to a valid runner
    steps:
      - name: Update runner's docker Version, as worker module requires it
        run: |
          docker --version

      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-pullnode1
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull image
        id: pull-image-node1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra
        run: |
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:worker
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:vote
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:result

  node2:
    name: Example Pull Image on node2
    runs-on: ubuntu-latest  # change this to a valid runner
    steps:
      - name: Update runner's docker Version, as worker module requires it
        run: |
          docker --version

      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-pullnode2
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull image
        id: pull-image-node2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra
        run: |
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:worker
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:vote
          docker pull 121731170468.dkr.ecr.us-east-1.amazonaws.com/learninfra:result

  deploy:  
    name: Example Deploy Application into Docker Swarm
    runs-on: ubuntu-latest  # change this to a valid runner
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy application images to Docker Swarm
        run: |
          docker node ls
          docker service ls
          docker stack ls
          docker stack rm stackdemo
          sleep 30
          docker stack deploy --compose-file docker-stack.yml stackdemo
